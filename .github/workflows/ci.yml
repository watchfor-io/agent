name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - run: go mod verify
      - run: go mod tidy -diff
      - run: test -z "$(gofmt -l ./cmd ./internal)"
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - run: go run honnef.co/go/tools/cmd/staticcheck@2025.1.1 ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      # G304 (file path from a variable) is what a /proc reader does all day;
      # G204 (subprocess with a variable) is systemctl with constant verbs.
      - run: go run github.com/securego/gosec/v2/cmd/gosec@latest -quiet -exclude=G304,G204 ./...
      - run: CGO_ENABLED=0 go build -trimpath -ldflags '-s -w' ./cmd/watchfor-agent
      - run: ./watchfor-agent check
